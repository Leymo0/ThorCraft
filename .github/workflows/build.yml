name: Build

# Builds the Minecraft mod (JAR) and the Thor companion app (APK) on every push,
# and publishes both on the Releases page so they can be downloaded straight to the Thor.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Fabric mod (JAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: thorcraft-mod
          path: mod/build/libs/thorcraft-*.jar
          if-no-files-found: error

  app:
    name: Companion app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/ThorCraft-Panel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: thorcraft-panel-apk
          path: out/ThorCraft-Panel.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [mod, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ThorCraft build ${{ github.run_number }}
          make_latest: true
          body: |
            **Install on the AYN Thor**
            1. `ThorCraft-Panel.apk` — install it on the Thor (the bottom-screen panel app).
            2. `thorcraft-*.jar` — add it to your Cobbleverse instance's **mods** folder in Zalith Launcher.

            Built automatically from commit ${{ github.sha }}.
          files: dist/*
