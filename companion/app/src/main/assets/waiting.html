<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eceef2; font: 500 15px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .logo { font-size: 26px; font-weight: 900; color: #ff7a2f; letter-spacing: .02em; }
  .sub { color: #8a92a2; margin-top: 6px; }
  .blocks { display: grid; grid-template-columns: repeat(3, 18px); gap: 5px; margin: 26px auto; }
  .blocks i { width: 18px; height: 18px; background: #1f222a; border-radius: 3px; animation: pulse 1.4s infinite; }
  .blocks i:nth-child(2) { animation-delay: .15s } .blocks i:nth-child(3) { animation-delay: .3s }
  .blocks i:nth-child(4) { animation-delay: .45s } .blocks i:nth-child(5) { animation-delay: .6s } .blocks i:nth-child(6) { animation-delay: .75s }
  @keyframes pulse { 0%, 100% { background: #1f222a } 40% { background: #3ddc84 } }
  .play { background: #5b8731; border-color: #3b5a1e; font-size: 20px; padding: 14px 40px; }
  button { margin-top: 18px; background: #1f222a; color: #eceef2; border: 1px solid #2a2e38; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 700; }
  .tip { color: #6b7280; font-size: 12px; margin-top: 20px; max-width: 320px; }
</style>
</head>
<body>
  <div class="logo">ThorCraft</div>
  <div class="sub" id="msg">Waiting for Minecraft…</div>
  <div class="blocks"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button class="play" onclick="if (window.Thor && Thor.launchGame) document.getElementById('msg').textContent = Thor.launchGame()">▶ Play</button>
  <div><button onclick="window.Thor && Thor.openHub && Thor.openHub()">Mod &amp; app updates</button>
  <button onclick="window.Thor && Thor.hide()">Hide panel</button></div>
  <div class="tip">Launch Minecraft with the ThorCraft mod on the top screen. This panel connects by itself.</div>
<script>
  const port = (window.Thor && Thor.port && Thor.port()) || 47123;
  const base = 'http://127.0.0.1:' + port;
  let tries = 0;
  async function poll() {
    tries++;
    try {
      const r = await fetch(base + '/ping', { cache: 'no-store' });
      if (r.ok) {
        document.getElementById('msg').textContent = 'Connected!';
        if (window.Thor && Thor.open) Thor.open(base + '/'); else location.href = base + '/';
        return;
      }
    } catch (e) { }
    if (tries > 30) document.getElementById('msg').textContent = 'Waiting for Minecraft… (is the ThorCraft mod installed?)';
    setTimeout(poll, 1500);
  }
  poll();
</script>
</body>
</html>
